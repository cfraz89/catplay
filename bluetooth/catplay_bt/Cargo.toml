[package]
name = "catplay_bt"
version = "0.1.0"
edition = "2024"

[dependencies]
catplay_util = { path = "../../core/catplay_util"}

libc = "0.2.183"
log = "0.4.27"
dbus = { version = "0.9.9", features = ["stdfd"] }
dbus-tokio = "0.7.6"
dbus-crossroads = "0.5.2"
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "sync"] }
thiserror = "2.0.16"
macaddr = "1.0.1"

[dev-dependencies]
#catplay_iap2 = { path = "../catplay_iap2" }
catplay_mfi = { path = "../../core/catplay_mfi" }
hexdump = "0.1.2"
catplay_tracing = { path = "../../core/catplay_tracing" }
